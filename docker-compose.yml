services:
  mezabi:
    image: webdevops/php-apache-dev:8.4-alpine
    container_name: mezabi-ct
    working_dir: /app/
    ports:
      - 8080:80
    volumes:
      - ./:/app/
    environment:
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/app
  mezabi-db:
    image: mysql:8
    container_name: mezabi-db-ct
    environment:
      - MYSQL_USER=mezabi-user
      - MYSQL_DATABASE=mezabi-db
      - MYSQL_PASSWORD=mezabi-password
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "6612:3306"
    volumes:
      - ./sql/:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8 --collation-server=utf8_general_ci 
